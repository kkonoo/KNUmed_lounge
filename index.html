</header>
<main>
  <div class="install-banner" id="installBanner" hidden></div>
  <p class="home-intro">기초교실 교수님들의 친목회 소식과 연구 소개를 한곳에 모았어요.</p>
  <div id="nextEvent" hidden></div>
  <!-- 입구 추가: <화면>/ 폴더를 만들고 여기에 카드 하나. 아직 안 연 곳은 <div class="door soon"> -->
  <nav class="door-cards">
    <a class="door" href="events/">
      <span class="door-icon"><span data-icon="utensils"></span></span><b>기초친목회</b><span>이번 달 날짜·장소를 보고 참석을 체크해요</span>
      <small></small>
    </a>
    <a class="door" href="board/">
      <span class="door-icon"><span data-icon="messages-square"></span></span><b>자유 게시판</b><span>세미나 소식, 장비 나눔, 이런저런 이야기를 올려요</span>
      <small id="boardFoot"></small>
    </a>
    <a class="door" href="people/">
      <span class="door-icon"><span data-icon="microscope"></span></span><b>연구실 둘러보기</b><span>교수님별 연구와 키워드. 이름·교실·주제로 찾아요</span>
      <small></small>
    </a>
    <a class="door" href="ask/">
      <span class="door-icon"><span data-icon="handshake"></span></span><b>공동연구 찾기</b><span>필요한 모델·시료·장비·기법을 적으면 학내에서 갖고 계신 분을 찾아 드려요</span>
      <small></small>
    </a>
  </nav>

  경북의대 라운지 · 기초친목회
